{% extends "base.html" %}
{% block content %}
<h2>Customers ({{ customers|length }})</h2>
<table class="grid">
  <tr><th>#</th><th>Name</th><th>Phone</th><th>Email</th><th>Customer since</th><th>Last visit</th></tr>
  {% for c in customers %}
  <tr><td>{{ c.id }}</td><td>{{ c.name }}</td><td>{{ c.phone }}</td><td>{{ c.email }}</td><td>{{ c.joined }}</td><td>{{ c.last_visit }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
