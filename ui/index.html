<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barnaby</title>
<link rel="icon" href="/ui/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/style.css" id="look">
<script>
/* ?skin=<name> swaps the stylesheet before first paint; app.js then speaks in the household's words (plain activity,
   decisions kept). ?skin=app is the professional app look (pending the director's approval); signpost and ticket are
   last round's themed skins, kept for comparison. DEFAULT is the look with no ?skin: set it to 'app' to make the app
   the default, and ?skin=classic still opens the old look (style.css). ?skin=app3 is round 3, modelled on the Claude
   and Codex desktop apps; ?theme=dark|light (or the switch in app3, remembered) picks its light or dark. */
(function () {
  var DEFAULT = 'app3';   // approved by the director (round 3); ?skin=classic opens the old look
  var t = /[?&]theme=(light|dark)\b/.exec(location.search), theme = t ? t[1] : null;
  try { theme = theme || localStorage.getItem('barnaby-theme'); } catch (e) {}
  if (theme) document.documentElement.setAttribute('data-theme', theme);
  var m = /[?&]skin=(app3|app|signpost|ticket|classic)\b/.exec(location.search);
  var skin = m ? m[1] : DEFAULT;
  if (!skin || skin === 'classic') return;
  document.documentElement.setAttribute('data-skin', skin);
  document.getElementById('look').remove();
  document.write('<link rel="stylesheet" href="/ui/skins/' + skin + '.css">');
})();
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Barnaby's mark (app3): a counter bell wearing a bow tie; the tie is cut out of the brass by this mask -->
    <mask id="bb-tie" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M22.4 31.6 L29.6 36.4 L22.4 41.2 Z M41.6 31.6 L34.4 36.4 L41.6 41.2 Z" fill="#000" stroke="#000" stroke-width="2.6" stroke-linejoin="round"/>
      <rect x="29.2" y="33.4" width="5.6" height="6" rx="2" fill="#000"/>
    </mask>
    <linearGradient id="brassG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0cf8f"/><stop offset=".55" stop-color="#d4a85a"/><stop offset="1" stop-color="#9c7232"/>
    </linearGradient>
    <symbol id="bell" viewBox="0 0 64 64">
      <circle cx="32" cy="13" r="3.6" fill="url(#brassG)"/>
      <rect x="30.4" y="15.5" width="3.2" height="6" rx="1.2" fill="url(#brassG)"/>
      <path d="M9 45 A23 23 0 0 1 55 45 Z" fill="url(#brassG)"/>
      <path d="M17 38 A16 16 0 0 1 27 26" fill="none" stroke="#fff3d6" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="5" y="46" width="54" height="5.5" rx="2.75" fill="url(#brassG)"/>
    </symbol>
    <!-- the skins' pictograms: one 2px stroke, round ends, currentColor -->
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-bell" viewBox="0 0 24 24"><path d="M4.6 16.4a7.4 7.4 0 0 1 14.8 0z" fill="currentColor" stroke="none"/><rect x="2.6" y="17.3" width="18.8" height="2.8" rx="1.3" fill="currentColor" stroke="none"/><path d="M12 9.1V6.9"/><circle cx="12" cy="5.4" r="1.7" fill="currentColor" stroke="none"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/><path d="M9 21h6"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-done" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-doing" viewBox="0 0 24 24"><path d="M12 4.5a7.5 7.5 0 1 1-6.5 3.75"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="3.5"/><path d="M10 13l9-9"/><path d="M16 7l2.2 2.2"/><path d="M13.6 9.4l1.6 1.6"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-shut" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-passage" viewBox="0 0 24 24"><rect x="2.5" y="6.5" width="6.5" height="11"/><rect x="15" y="6.5" width="6.5" height="11"/><path d="M9 12h6"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-room" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17"/><path d="M12 8v8"/><path d="M8 12h8"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-pen" viewBox="0 0 24 24"><path d="M4 20l1-4.5L16 4.5l3.5 3.5L8.5 19z"/><path d="M14 7l3.5 3.5"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-look" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-no" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11"/><path d="M17.5 6.5l-11 11"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-warn" viewBox="0 0 24 24"><path d="M12 3.5l9.5 17h-19z"/><path d="M12 10v4.5"/><path d="M12 17.5v.01"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-plan" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16"/><path d="M3 11h7"/><path d="M10 4v7"/><path d="M14 4v16"/><path d="M14 13h7"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-use" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" fill="currentColor"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-chev" viewBox="0 0 24 24"><path d="M9 5.5l6.5 6.5L9 18.5"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-keys" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01"/><path d="M10 10h.01"/><path d="M14 10h.01"/><path d="M17.5 10h.01"/><path d="M7.5 14h9"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M15 4.5v15"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" id="i-send" viewBox="0 0 24 24"><path d="M12 19V5.5M6 11.5l6-6 6 6"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-can" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.3l2.6 2.6 5-5.2"/></symbol>
    <symbol fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="i-plug" viewBox="0 0 24 24"><path d="M9 3v5"/><path d="M15 3v5"/><path d="M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v4"/></symbol>
  </defs>
</svg>

<header class="top">
  <div class="brand"><svg aria-hidden="true"><use href="#bell"/></svg><span>Barnaby</span></div>
  <div class="status" id="status" aria-live="polite"><span class="dot"></span><span id="status-text">at your service</span></div>
  <div class="systems-chips" id="systems-chips"></div>
  <button class="ghost" id="toggle-map" type="button" aria-expanded="false" aria-controls="map">Capabilities</button>
</header>

<main class="grid">
  <section class="convo" aria-label="Conversation">
    <ol id="messages" class="messages"></ol>
    <div id="cards" class="cards" aria-live="assertive"></div>
  </section>
  <section class="trace" aria-label="Live trace">
    <div class="panel-head"><h2>Live trace</h2><span id="trace-meta" class="muted"></span></div>
    <ol id="trace" class="trace-list"></ol>
  </section>
  <aside class="map" id="map" hidden aria-label="Capabilities">
    <div class="panel-head"><h2>Capabilities</h2><button class="ghost" id="close-map" type="button">Close</button></div>
    <div id="map-body"></div>
    <form id="connect-form" class="connect">
      <h3>Point Barnaby at a repo</h3>
      <label>Name <input name="name" placeholder="quorum" required></label>
      <label>Repo path <input name="repo" placeholder="X:\path\to\repo" required></label>
      <label>API base URL <input name="base_url" placeholder="http://127.0.0.1:8000" required></label>
      <button type="submit">Connect</button>
    </form>
  </aside>
</main>

<aside class="inspector" id="inspector" hidden aria-label="Barnaby at a glance"></aside>

<footer class="input">
  <button id="talk" class="talk" type="button" title="Hold to talk (or hold Space)">
    <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span class="label">Hold to talk</span>
  </button>
  <form id="ask-form" class="ask">
    <input id="ask-input" autocomplete="off" placeholder="Ask Barnaby…" aria-label="Ask Barnaby">
    <button type="submit">Ask</button>
  </form>
</footer>

<script src="/ui/app.js"></script>
<script src="/ui/voice.js"></script>
</body>
</html>
