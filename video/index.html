<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Barnaby: the film</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0E1117;color:#F1ECE1;
  font-family:"Segoe UI Variable Display","Segoe UI Variable","Segoe UI","Segoe UI Symbol",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
/* ---- layers (bottom -> top): #bg, #glow, #vig, #stage, #fx, #cap, #black ---- */
#bg{position:absolute;left:-128px;top:-128px;width:2176px;height:1336px;
  background-image:linear-gradient(rgba(212,168,90,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(212,168,90,.035) 1px,transparent 1px);
  background-size:64px 64px}
#glow{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 70% 20%,rgba(212,168,90,.08),transparent 70%)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.7) 100%);pointer-events:none}
canvas.layer{position:absolute;left:0;top:0;width:1920px;height:1080px}
#stage{position:absolute;inset:0;overflow:hidden;z-index:0;isolation:isolate}
#fx,#cap,#black{z-index:1}
#fontwarm{position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;transform-origin:960px 540px}
#cap{position:absolute;left:0;right:0;top:930px;text-align:center;pointer-events:none;display:none}
#cap span{display:inline-block;font-size:40px;font-weight:600;color:#fff;line-height:1.25;background:rgba(10,12,17,.8);
  padding:12px 32px 14px;border-radius:16px;border:1px solid rgba(212,168,90,.25);box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:1680px}
#black{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}

/* ---- shared classes for scenes ---- */
.abs{position:absolute}
.mono{font-family:"Cascadia Mono",Consolas,monospace}
.serif{font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif}
.card{position:absolute;background:rgba(22,26,34,.94);border:1px solid rgba(212,168,90,.28);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.hero{font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;color:#F1ECE1}
.brass{color:#D4A85A}.good{color:#22C55E}.bad{color:#E66767}.sub{color:#C2BBA9}.muted{color:#8D8778}
.chip{display:inline-block;padding:4px 14px;border-radius:999px;font-size:20px;font-weight:600;border:1px solid;white-space:nowrap}
.btn{display:inline-block;padding:12px 26px;border-radius:12px;background:linear-gradient(#D9B06A,#B88A3E);color:#16120A;font-weight:700;font-size:24px}
.btn.ghost{background:#1B202A;color:#F1ECE1;border:1px solid #3A404C}
/* components.js styles */
.xp{font-family:Verdana,Tahoma,Geneva,sans-serif;color:#000;background:#ECE9D8;border:1px solid #6B6B6B;border-radius:8px 8px 3px 3px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.6)}
.xp-title{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#2B7BE9,#0A4FC4 60%,#0A46B0);color:#fff;font:bold 17px Tahoma,Verdana,sans-serif;padding:7px 10px 7px 12px}
.xp-title .b{display:flex;gap:3px}.xp-title .b i{width:22px;height:21px;border-radius:4px;border:1px solid #fff;background:linear-gradient(#5D97F2,#2766D6);display:block}
.xp-title .b i:last-child{background:linear-gradient(#E9775A,#C2361B)}
.xp-banner{background:linear-gradient(#3A6EA5,#1D4A77);color:#fff;padding:12px 16px 10px;border-bottom:5px solid #FFCC00}
.xp-banner b{display:block;font:italic bold 34px "Trebuchet MS",Verdana,sans-serif;text-shadow:2px 2px 0 #0B2A4A}
.xp-banner span{font-size:15px;color:#FFE680}
.xp-nav{padding:5px 8px;background:#D4D0C8;border-bottom:1px solid #808080;white-space:nowrap;overflow:hidden}
.xp-nav a{display:inline-block;color:#00E;text-decoration:underline;padding:2px 10px;margin:2px 2px;background:linear-gradient(#fff,#E3E0D8);border:2px outset #F4F4F4;font-size:15px}
.xp-nav a.on{border-style:inset;background:#ECE9D8;color:#551A8B;font-weight:bold}
.xp-body{background:#fff;padding:10px 12px}
.xp-body h4{font:bold 18px Verdana;color:#1D4A77;margin-bottom:8px}
.xp table{border-collapse:collapse;width:100%;font-size:15px}
.xp th{background:#D4D0C8;border:1px solid #808080;text-align:left;padding:4px 6px}
.xp td{border:1px solid #C6C6C6;padding:4px 6px;white-space:nowrap}
.xp tr:nth-child(even) td{background:#EEF3FB}
.xp .hl{background:#FFF6BF!important}
.xp-foot{display:flex;justify-content:space-between;font-size:12px;color:#555;padding:6px 10px;background:#ECE9D8;border-top:1px solid #C0C0C0}
.hud{position:absolute;background:rgba(14,17,23,.985);border:1px solid rgba(212,168,90,.55);border-radius:22px;box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 60px rgba(212,168,90,.12);padding:20px 24px;color:#F1ECE1}
.hud-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hud-name{font:28px "Palatino Linotype",Palatino,Georgia,serif}
.hud-state{margin-left:auto;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#C2BBA9;padding:5px 12px;border:1px solid rgba(212,168,90,.35);border-radius:999px}
.hud-you{font-size:19px;color:#C2BBA9;margin-bottom:12px}
.hud-you b{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#8D8778;margin-right:8px}
.hud-say{font:italic 24px/1.45 "Palatino Linotype",Palatino,Georgia,serif;color:#F1ECE1}
.tr{display:flex;align-items:center;gap:12px;font:17px/1.3 "Cascadia Mono",Consolas,monospace;color:#C2BBA9;background:#1B202A;border:1px solid #262B35;border-left:4px solid #3A404C;border-radius:10px;padding:9px 12px;margin-bottom:8px}
.tr .d{width:10px;height:10px;border-radius:50%;flex:none;background:#8D8778}
.tr b{color:#F1ECE1;font-weight:600}
.tr .tag{margin-left:auto;font:600 12px "Segoe UI",sans-serif;letter-spacing:.12em;text-transform:uppercase}
.apcard{position:absolute;border:1px solid rgba(212,168,90,.6);background:linear-gradient(160deg,rgba(212,168,90,.1),transparent 60%),#161A22;border-radius:18px;padding:18px 22px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.apcard .k{font:600 14px "Segoe UI",sans-serif;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.apcard .t{font:28px "Palatino Linotype",Palatino,Georgia,serif;margin-bottom:10px}
.diff{background:#0B0E13;border:1px solid #262B35;border-radius:12px;font:16px/1.5 "Cascadia Mono",Consolas,monospace;overflow:hidden}
.diff .f{background:#222834;padding:7px 12px;font-weight:600;color:#F1ECE1}
.diff .l{white-space:pre;padding:0 12px;color:#C2BBA9}
.diff .a{background:rgba(34,197,94,.14);color:#BDF0C9}.diff .r{background:rgba(230,103,103,.13);color:#F3B9B9}.diff .hk{color:#8D8778}
.term{position:absolute;background:#0B0E13;border:1px solid #262B35;border-radius:14px;font:18px/1.5 "Cascadia Mono",Consolas,monospace;color:#C2BBA9;padding:14px 18px;box-shadow:0 30px 70px rgba(0,0,0,.5);overflow:hidden}
.term .p{color:#D4A85A}.term .ok{color:#22C55E}
.ep{display:inline-block;font:15px "Cascadia Mono",Consolas,monospace;padding:6px 10px;border-radius:8px;border:1px solid #262B35;color:#8D8778;background:#0E1117;margin:0 8px 8px 0}
.ep.on{border-color:#B88A3E;color:#F1ECE1;background:rgba(212,168,90,.1)}
.ep.new{border-color:#9085E9;color:#F1ECE1;box-shadow:0 0 0 4px rgba(144,133,233,.22)}
</style></head>
<body>
<div id="bg"></div>
<div id="glow"></div>
<div id="vig"></div>
<div id="stage"></div>
<canvas id="fx" class="layer" width="1920" height="1080"></canvas>
<div id="cap"><span id="capt"></span></div>
<div id="black"></div>
<div id="fontwarm">▶✓✔✕→←·•…—–★●○◆⌘⚠ <span class="mono">▶→·●✓</span> <span class="serif">Barnaby ma'am</span> <span style="font-family:Verdana">Spokes</span> <span style="font-family:'Trebuchet MS'">Sprockets</span></div>

<script src="lib.js"></script>
<script src="data.js"></script>
<script src="components.js"></script>
<script src="scenes/manifest.js"></script>
<script>document.write(SCENE_FILES.map(f => `<script src="scenes/${f}"><\/script>`).join(''));</script>
<script src="main.js"></script>
</body></html>
