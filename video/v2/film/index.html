<!DOCTYPE html>
<!--
  Barnaby · the film · v2.1, animated (from the approved gate-3 animatic, ../animatic). On the clock of the real voice
  lines (video/v2/cues.json, laid out by video/v2/audio/layout.py -> ../animatic/cues.js; not re-timed here).

  OPEN     this file in Chrome with --allow-file-access-from-files (the look-dev pages run live in iframes);
           window.render(t) draws any moment, then await window.settle().
  RENDER   node video/v2/film/render.js            -> out/frames -> out/barnaby_v2.mp4 (1920x1080, 24 fps, with sound)
           node video/v2/film/render.js sheets     -> out/sheets/scene_<n>.jpg (one contact sheet per scene)
  ENGINE   ../../lib.js (v1: timing, easing, DOM helpers, the Scene registry) + shots.js (stills with a camera, the
           Blender agent's sequences, the approved look-dev pages driven live through their state keys) + main.js
           (frame loop) + scenes/s1..s9.js. No captions: on-screen text only where the script has it.
-->
<html lang="en-GB"><head><meta charset="utf-8"><title>Barnaby · v2.1 film</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000;color:#EEEAE1;
  font-family:"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#stage{position:absolute;inset:0;overflow:hidden;isolation:isolate;background:#000}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;overflow:hidden;background:#000}
.shot{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;display:none}
.shot img,.shot iframe,.shot .layer{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none}
.shot .layer > *{position:absolute}
.ov{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
.label{position:absolute;display:none}
/* while the live look-dev pages load they must be laid out (they measure text and read their window size) */
body.loading .scene,body.loading .shot{display:block!important;visibility:hidden}
#black{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:99}
/* Barnaby's type (ui/skins/app3.css): Sitka Subheading / Sitka Text, brass #D3A14A and ivory #EEEAE1 on charcoal */
.t-serif{font-family:"Sitka Subheading","Sitka Text",Constantia,Georgia,serif}
.t-text{font-family:"Sitka Text",Constantia,Georgia,serif}
.t-mono{font-family:"Cascadia Code","Cascadia Mono",Consolas,monospace}
.t-martin{font-family:"MFig","Gill Sans MT","Gill Sans","Segoe UI",sans-serif}
/* titles and the end card (TITLES.md) */
.t-titles{display:flex;flex-direction:column;align-items:center;padding-top:150px}
.t-titles .lock{text-shadow:0 2px 18px rgba(8,7,6,.6);display:flex;align-items:flex-end;gap:26px;font:600 112px/1 "Sitka Subheading","Sitka Text",Constantia,Georgia,serif;color:#EEEAE1;letter-spacing:-.012em;margin-left:-12px}
.t-titles .lock .m{display:block;width:92px;height:92px;margin-bottom:14px}
.t-titles .line{font:400 46px/1.25 "Sitka Text",Constantia,Georgia,serif;color:rgba(238,234,225,.94);letter-spacing:.003em;margin-top:44px;text-shadow:0 1px 14px rgba(8,7,6,.7)}
.t-titles .coda{color:#D3A14A;margin-top:10px}
.t-card{background:#1F1E1C;color:#EEEAE1;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  display:flex;flex-direction:column;justify-content:center;padding:0 192px}
.t-card .head{display:flex;flex-direction:column;align-items:center}
.t-card .head .m{display:block;width:88px;height:88px}
.t-card .head .w{font:600 88px/1 "Sitka Subheading","Sitka Text",Constantia,Georgia,serif;letter-spacing:-.012em;margin-top:24px}
.t-card .head .what{font:400 34px/1.3 "Sitka Text",Constantia,Georgia,serif;color:#C2BBAE;margin-top:24px;text-wrap:balance;text-align:center}
.t-card .grow{display:grid;grid-template-columns:repeat(4,1fr);column-gap:48px;border-top:1px solid #3B3934;margin-top:48px;padding-top:32px}
.t-card .grow b{display:block;font:600 34px/1.1 "Sitka Subheading","Sitka Text",Constantia,Georgia,serif;color:#EEEAE1}
.t-card .grow span{display:block;font:400 21px/1.45 "Segoe UI Variable Text","Segoe UI",sans-serif;color:#B1AA9C;margin-top:12px;max-width:310px;text-wrap:pretty}
.t-card .cred{display:flex;gap:28px;align-items:baseline;border-top:1px solid #3B3934;margin-top:48px;padding-top:32px;font:400 21px/1.3 "Segoe UI Variable Text","Segoe UI",sans-serif;color:#C2BBAE}
.t-card .cred b{font-weight:600;color:#EEEAE1}
.t-card .repo{margin-top:12px;font:400 21px/1.3 "Segoe UI Variable Text","Segoe UI",sans-serif;color:#C2BBAE}
.t-card .fine{margin-top:24px;font:400 16px/1.45 "Segoe UI Variable Text","Segoe UI",sans-serif;color:#A39C8F}
#fontwarm{position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap}
</style></head>
<body class="loading">
<div id="stage"></div>
<div id="black"></div>
<div id="fontwarm"><span class="t-serif">Barnaby Every system</span> <span class="t-text">Even the old ones ·×</span>
  <span class="t-mono">synapse · 0.38 s</span> <span class="t-martin">synapse</span></div>
<script src="../../lib.js"></script>
<script src="../animatic/cues.js"></script>
<script src="shots.js"></script>
<script src="scenes/manifest.js"></script>
<script>document.write(SCENE_FILES.map(f => `<script src="scenes/${f}"><\/script>`).join(''));</script>
<script src="main.js"></script>
</body></html>
