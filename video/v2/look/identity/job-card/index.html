<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barnaby · Job Card</title>
<style>
@font-face{font-family:"JC Form";src:local("Franklin Gothic Medium Cond"),local("FranklinGothic-MediumCond")}
@font-face{font-family:"JC Head";src:local("Franklin Gothic Demi Cond"),local("FranklinGothic-DemiCond")}
:root{
  --paper:#FBFBF8;        /* top copy: Martin's */
  --canary:#F5EAA6;       /* second copy, and the highlighter: available, sign here, added */
  --canary-deep:#E3CF6A;
  --pink:#F4DDD7;         /* office copy: filed cards, and Theo's full record */
  --pink-lt:#FBF0EC;
  --manila:#E9D6A8;       /* tag stock: the tear-off tag that hangs on the bike */
  --ink:#1C1C1A;          /* printer's black */
  --graphite:#47463F;     /* written-in text */
  --rule:#BEBAAE;         /* ruled lines */
  --number:#B3271B;       /* numbering-machine red */
  --brass:#8E6820;        /* the bell, printed in brass ink */
  --form:"JC Form","Arial Narrow",sans-serif;   /* the printed form: labels, numbers */
  --head:"JC Head","JC Form",sans-serif;       /* printed headings: the wordmark, room names, stamps */
  --print:"Franklin Gothic Medium","Franklin Gothic Book",Arial,sans-serif;
  --text:"Segoe UI",system-ui,sans-serif;
  --code:Consolas,"Cascadia Mono",monospace;
  --hand:"Segoe Print","Comic Sans MS",cursive;   /* Theo's handwriting on a sticky note, nowhere else */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:20px/1.45 var(--text);display:grid;grid-template-rows:88px 1fr 108px;height:1080px;width:1920px;overflow:hidden;caret-color:var(--number)}
::selection{background:var(--canary);color:var(--ink)}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;flex:none}
svg.i.sm{width:.85em;height:.85em;vertical-align:-1px;stroke-width:2.6}
button{font:22px/1 var(--print);border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);padding:14px 26px;cursor:pointer;border-radius:2px;display:inline-flex;align-items:center;gap:10px}
button:hover{background:var(--canary)}
button.primary{background:var(--ink);color:var(--paper)}
button.primary:hover{background:#3a3a36}
button:focus-visible,a:focus-visible{outline:3px solid var(--number);outline-offset:3px}
.link{font:20px var(--print);color:var(--ink);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1.5px;background:none;border:0;padding:6px 4px}
.link:hover{background:var(--paper)}
.link.open{background:var(--paper);outline:1.5px solid var(--ink);padding:6px 12px;text-decoration:none}
.tech{font:15px var(--code);color:var(--graphite)}
.hint{font:17px var(--form);color:var(--graphite)}

/* ── header: the form's printed head, double rule beneath ── */
header{display:flex;align-items:center;gap:26px;padding:0 40px;border-bottom:2px solid var(--ink);box-shadow:0 5px 0 -3px var(--paper),0 6px 0 -3px var(--ink);position:relative;z-index:2;background:var(--paper)}
.mark{display:flex;align-items:center;gap:16px}
.mark svg{width:50px;height:50px;color:var(--brass);stroke-width:1.6}
.mark b{font:38px/1 var(--head);letter-spacing:.06em;text-transform:uppercase}
.mark span{font:16px/1.25 var(--text);color:var(--graphite);border-left:1.5px solid var(--ink);padding-left:16px}
.now{margin-left:auto;display:flex;align-items:baseline;gap:12px;font:22px var(--print)}
.now small{font:16px var(--form);color:var(--graphite)}
.now .live{display:inline-block;width:12px;height:12px;background:var(--number);border-radius:50%;transform:translateY(-2px)}
nav{display:flex;gap:4px;margin-left:24px}
nav a{font:21px var(--print);color:var(--graphite);padding:10px 18px;text-decoration:none;border:1.5px solid transparent}
nav a:hover{color:var(--ink);border-color:var(--rule)}
nav a.on{color:var(--ink);border-color:var(--ink);background:var(--canary)}
.desk{display:flex;align-items:center;gap:10px;font:16px var(--form);color:var(--graphite)}
.desk button{font:21px var(--print);padding:9px 14px;gap:12px;min-width:150px;justify-content:space-between}
.desk button svg{width:16px;height:16px}
.date{font:18px var(--form);color:var(--graphite)}

/* ── main ── */
main{display:grid;grid-template-columns:1fr 560px;min-height:0}
.deskarea{padding:30px 40px 24px;min-height:0;overflow:hidden}
.filed{background:var(--pink);border-left:1.5px solid var(--ink);padding:26px 32px;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:16px}
.filed h2{font:24px var(--print);margin:0}

/* the card: printed boxes with small labels, written-in values */
.card{border:1.5px solid var(--ink);background:var(--paper)}
.row{display:grid;border-bottom:1px solid var(--ink)}
.row:last-child{border-bottom:0}
.f{padding:10px 16px 14px;border-right:1px solid var(--ink);min-width:0}
.f:last-child{border-right:0}
.f>label{display:block;font:16px/1.2 var(--form);color:var(--ink);margin-bottom:6px}
.no{font:44px/1 var(--form);color:var(--number);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.val{font:22px/1.3 var(--text);color:var(--graphite)}
.val svg{vertical-align:-3px;margin-right:6px}
.asked{font:27px/1.35 var(--text);color:var(--graphite)}
.says{font:36px/1.3 var(--print);color:var(--ink);max-width:31em;text-wrap:pretty}
.says.wait{color:var(--graphite);font-size:30px}
.says.wait b{color:var(--ink);font-weight:normal}
.caret{display:inline-block;width:3px;height:1em;background:var(--ink);vertical-align:-4px;margin-left:6px}

/* work done: a ticked list */
.work{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.work li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font:21px/1.35 var(--text);color:var(--graphite)}
.box{width:26px;height:26px;border:1.5px solid var(--ink);display:grid;place-items:center;margin-top:1px;background:var(--paper)}
.box svg{width:22px;height:22px;stroke-width:2.6}
.box.doing{border-style:dashed}
.work b{font-weight:600;color:var(--ink)}
.work .sub{display:block;font-size:18px;margin-top:2px}

/* due list: a ruled table */
table{border-collapse:collapse;width:100%;font:19px/1.3 var(--text);color:var(--graphite);font-variant-numeric:tabular-nums}
th{font:16px var(--form);color:var(--ink);text-align:left;padding:4px 10px 6px;border-bottom:1.5px solid var(--ink);font-weight:normal}
td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
td.n{font:19px var(--form);color:var(--number)}
td b{color:var(--ink);font-weight:600}
tr.short td{background:var(--canary)}
tr.short td.p{color:var(--ink);font-weight:600}
.pend{color:#6f6c62}

/* sign-off: the canary copy you sign, perforated from the card above */
.sign{position:relative;background:var(--canary);border:1.5px solid var(--ink);border-top:0;padding:24px 26px 20px}
.sign::before{content:"";position:absolute;left:-1.5px;right:-1.5px;top:-1px;border-top:2px dashed var(--ink)}
.sign h3{font:36px/1.15 var(--print);margin:0}
.lines{display:grid;grid-template-columns:230px 1fr;margin:16px 0 18px;border-top:1px solid var(--ink)}
.lines dt,.lines dd{margin:0;padding:10px 0;border-bottom:1px solid rgba(28,28,26,.35)}
.lines dt{font:18px/1.35 var(--form);padding-top:12px}
.lines dd{font:21px/1.4 var(--text);color:var(--ink)}
.lines dd svg{vertical-align:-3px;margin-right:6px}
.act{display:flex;align-items:center;gap:16px}
.sigline{margin-left:auto;display:flex;align-items:flex-end;gap:10px;font:17px var(--form)}
.sigline i{display:block;width:220px;border-bottom:1.5px solid var(--ink);height:28px}
.foot{display:flex;justify-content:space-between;gap:20px;margin-top:14px;font:16px var(--text);color:var(--graphite)}

/* filed copies */
.stub{border:1.5px solid var(--ink);background:var(--pink-lt);padding:12px 16px 14px}
.stub .top{display:flex;gap:12px;align-items:baseline;font:16px var(--form);color:var(--graphite)}
.stub .top .no{font-size:24px}
.stub .q{font:19px/1.35 var(--text);color:var(--ink);margin-top:4px}
.stub .out{font:17px/1.35 var(--text);color:var(--graphite);margin-top:6px;display:flex;gap:8px}
.stub .out svg{margin-top:3px}
.more{font:17px var(--form);color:var(--graphite)}
.keys{margin-top:auto;border-top:1.5px solid var(--ink);padding-top:14px}
.keys h3{font:21px var(--print);margin:0 0 8px}
.keys li{display:flex;gap:10px;align-items:center;font:18px var(--text);padding:4px 0}
.keys ul{list-style:none;margin:0;padding:0}
.keys .none{color:var(--graphite);font-size:18px;margin:0}

/* the change, attached as a continuation sheet */
.sheet{background:var(--paper);border:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0;flex:1}
.sheet .sh{padding:14px 18px;border-bottom:1.5px solid var(--ink)}
.sheet .sh b{font:22px var(--print);display:block}
.sheet .sh span{font:17px var(--text);color:var(--graphite)}
.sheet .body{overflow:hidden;font:15px/1.5 var(--code);color:var(--graphite);flex:1}
.fileh{font:18px var(--print);color:var(--ink);padding:10px 18px 8px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.fileh span{font:15px var(--text);color:var(--graphite);text-align:right}
.ln{white-space:pre;padding:0 18px 0 34px;position:relative}
.ln.add{background:var(--canary);color:var(--ink)}
.ln.add::before{content:"+";position:absolute;left:14px}
.ln.hunk{color:#77746a;padding-top:6px}

/* ── the house: a printed premises plan ── */
.plan h2{font:30px var(--print);margin:0 0 4px}
.plan .sub{font:19px var(--text);color:var(--graphite);margin:0}
.house{position:relative;margin-top:30px;width:1240px;height:700px}
.room{position:absolute;border:4px solid var(--ink);background:var(--paper);padding:12px 16px}
.room h4{margin:0 0 6px;font:26px/1 var(--head);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:baseline;gap:10px}
.room h4 small{font:16px var(--text);text-transform:none;letter-spacing:0;color:var(--graphite)}
.room ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.room li{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:center;font:17.5px/1.3 var(--text);color:var(--graphite)}
.room li svg{width:20px;height:20px}
.room li mark{background:none;color:inherit}
.room li.lit mark{background:var(--canary);color:var(--ink);padding:0 4px;margin-left:-4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.room li.shut mark{text-decoration:line-through;text-decoration-thickness:1.5px}
.room li em{font-style:normal;font:15px var(--form);color:var(--number);margin-left:8px}
.room.dark{background:repeating-linear-gradient(-45deg,transparent 0 9px,rgba(28,28,26,.07) 9px 10px),var(--paper)}
.room.new{border-style:dashed}
.stamp{position:absolute;font:20px/1 var(--head);color:var(--number);border:2.5px solid var(--number);padding:5px 9px 6px;transform:rotate(-4deg);letter-spacing:.06em;text-transform:uppercase;background:rgba(251,251,248,.9)}
.passage{position:absolute;border:4px solid var(--ink);border-top-width:0;background:repeating-linear-gradient(90deg,var(--canary) 0 18px,var(--canary-deep) 18px 20px);display:flex;align-items:center;gap:16px;padding:0 20px;font:19px var(--text);color:var(--ink)}
.passage b{font:22px var(--head);text-transform:uppercase;letter-spacing:.04em;background:var(--paper);padding:4px 10px;border:1.5px solid var(--ink);white-space:nowrap}
.passage .when{margin-left:auto;font:16px var(--form);background:var(--paper);padding:2px 8px;border:1px solid var(--ink)}
.legend{display:grid;gap:12px;font:18px/1.3 var(--text);color:var(--graphite)}
.legend div{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}
.legend .sw{height:28px;border:1.5px solid var(--ink);display:grid;place-items:center;background:var(--paper)}
.legend b{color:var(--ink);font-weight:600}
.count{font:20px/1.4 var(--text);color:var(--ink);border-top:1.5px solid var(--ink);padding-top:14px}
.count .big{font:48px/1 var(--form);color:var(--number)}

/* ── Theo: the office copy, everything ── */
.office{background:var(--pink);padding:22px 40px 20px;display:grid;grid-template-columns:770px minmax(0,1fr) minmax(0,1fr);gap:18px;min-height:0;overflow:hidden;grid-column:1/-1}
.office>*{min-width:0;min-height:0}
.ob{border:1.5px solid var(--ink);background:var(--pink-lt);display:flex;flex-direction:column;min-height:0;overflow:hidden;flex:none}
.ob>header{all:unset;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 14px 8px;border-bottom:1.5px solid var(--ink)}
.ob>header b{font:21px var(--print)}
.ob>header span{font:16px var(--form);color:var(--graphite)}
.ob .tally{display:flex;gap:0;border-bottom:1px solid var(--ink)}
.ob .tally div{flex:1;padding:6px 14px 8px;border-right:1px solid var(--ink);font:15px var(--form);color:var(--graphite)}
.ob .tally div:last-child{border-right:0}
.ob .tally strong{display:block;font:30px/1.05 var(--form);color:var(--number);font-weight:normal}
table.eps{font:14.5px/1.25 var(--code);color:var(--ink)}
table.eps th{font:15px var(--form);padding:6px 6px 5px;border-bottom:1px solid var(--ink)}
table.eps td{padding:4px 6px;border-bottom:1px solid rgba(28,28,26,.16);white-space:nowrap}
table.eps td.st{width:28px;padding-right:0}
table.eps td.st svg{width:16px;height:16px;vertical-align:-3px}
table.eps td.rm{font:15px var(--text);color:var(--graphite)}
table.eps td.rw{font:15px var(--form);color:var(--graphite)}
table.eps tr.on td.path{background:var(--canary)}
table.eps tr.shut td.path{text-decoration:line-through}
table.eps td.m{color:var(--graphite);width:56px}
.runs{list-style:none;margin:0;padding:0}
.runs li{display:grid;grid-template-columns:62px minmax(0,1fr) 62px;gap:2px 10px;padding:6px 14px;border-bottom:1px solid rgba(28,28,26,.16);font:15px/1.3 var(--text);color:var(--graphite)}
.runs li:last-child{border-bottom:0}
.runs .w{font:15px var(--form);color:var(--ink)}
.runs code{font:14px/1.3 var(--code);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runs .s{font:17px var(--form);color:var(--number);text-align:right;font-variant-numeric:tabular-nums}
.runs .o{grid-column:2/4}
.calls{list-style:none;margin:0;padding:6px 0}
.calls li{display:grid;grid-template-columns:196px 1fr;gap:2px 10px;padding:3px 14px;font:14px/1.3 var(--code);color:var(--ink)}
.calls li .r{font:14px/1.3 var(--code);color:var(--graphite)}
.calls li.short .r{background:var(--canary);color:var(--ink);padding:0 4px;margin-left:-4px}
.calls .t{color:var(--graphite)}
.kv{display:grid;grid-template-columns:120px 1fr;font:15px/1.35 var(--text);color:var(--ink)}
.kv dt{font:15px var(--form);color:var(--graphite);padding:5px 0 5px 14px;border-bottom:1px solid rgba(28,28,26,.16)}
.kv dd{margin:0;padding:5px 14px 5px 0;border-bottom:1px solid rgba(28,28,26,.16)}
.kv code{font:14.5px var(--code)}
.log{list-style:none;margin:0;padding:6px 14px;font:14.5px/1.35 var(--text);color:var(--graphite)}
.log li{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:1px 0}
.log li b{font:14.5px var(--code);font-weight:normal;color:var(--graphite)}
.log li.new{color:var(--ink)}
.log li.new span{background:var(--canary)}
.ob .diff{font:13.5px/1.45 var(--code);color:var(--graphite);overflow:hidden;flex:1;min-height:0;background:var(--paper)}
.ob .diff .fileh{font:15px var(--print);padding:6px 12px 5px}
.ob .diff .ln{padding:0 12px 0 26px}
.ob .diff .ln.add::before{left:10px}

/* ── Priya: the bench, tags on the bikes (proposal) ── */
.bench{grid-column:1/-1;display:grid;grid-template-columns:1fr 600px;grid-template-rows:1fr auto;min-height:0;overflow:hidden}
.rail{position:relative;padding:26px 40px 0;min-height:0}
.rail .bar{position:absolute;left:40px;right:40px;top:88px;height:14px;background:#2b2a27;border-radius:7px}
.rail h2{font:30px var(--print);margin:0;display:flex;align-items:baseline;gap:16px}
.rail h2 small{font:19px var(--text);color:var(--graphite)}
.proposal{position:absolute;right:52px;top:22px;font:22px/1 var(--head);color:var(--number);border:2.5px solid var(--number);padding:6px 10px 7px;transform:rotate(3deg);letter-spacing:.08em;text-transform:uppercase}
.tags{position:absolute;left:70px;top:150px;display:flex;gap:56px}
.tag{position:relative;width:500px;height:612px;padding:88px 34px 26px;color:var(--ink)}
.tag>svg.shape{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tag>*:not(svg){position:relative}
.tag .hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px solid var(--ink);padding-bottom:8px}
.tag .hd span{font:16px/1.2 var(--form);letter-spacing:.04em;text-transform:uppercase}
.tag .hd .no{font-size:46px}
.tag dl{display:grid;grid-template-columns:96px 1fr;margin:8px 0 0}
.tag dt{font:16px var(--form);padding:8px 0 7px;border-bottom:1px solid rgba(28,28,26,.3)}
.tag dd{margin:0;font:21px/1.3 var(--text);padding:6px 0 7px;border-bottom:1px solid rgba(28,28,26,.3)}
.tag dd b{font-weight:600}
.tag dd small{display:block;font-size:17px;color:var(--graphite)}
.tag .parts{margin-top:12px}
.tag .parts label{font:16px var(--form)}
.tag .parts li{display:grid;grid-template-columns:28px 1fr;gap:8px;font:18px/1.3 var(--text);padding:4px 0}
.tag .parts li svg{width:20px;height:20px;margin-top:2px;stroke-width:2.4}
.tag .parts li small{display:block;color:var(--graphite);font-size:17px}
.tag .parts li.no-stock small{color:var(--ink);font-weight:600}
.tag .parts ul{list-style:none;margin:4px 0 0;padding:0}
.tag .state{position:absolute;left:34px;right:34px;bottom:24px;display:flex;align-items:center;gap:12px;font:22px var(--print);padding:10px 14px;border:2px solid var(--ink);background:var(--paper)}
.tag .state.short{background:var(--canary)}
.tag .state svg{width:26px;height:26px;stroke-width:2.6}
.chat{border-left:1.5px solid var(--ink);padding:26px 32px;display:flex;flex-direction:column;gap:18px;min-height:0}
.note{background:#FBE97A;padding:20px 22px 22px;font:25px/1.35 var(--hand);color:#1d2a6b;transform:rotate(-1.5deg);box-shadow:0 6px 14px -6px rgba(28,28,26,.45);width:420px;align-self:center;margin-top:6px}
.note small{display:block;font:17px var(--form);color:var(--graphite);margin-bottom:6px;transform:none}
.asks{grid-column:1/-1;background:var(--canary);border-top:1.5px solid var(--ink);padding:16px 40px 18px;display:flex;align-items:baseline;gap:18px;flex-wrap:nowrap}
.asks>b{font:21px var(--print);white-space:nowrap}
.asks ul{list-style:none;margin:0;padding:0;display:flex;gap:12px;flex-wrap:nowrap}
.asks li{background:var(--paper);border:1.5px solid var(--ink);padding:8px 14px 9px;font:19px/1.25 var(--text);color:var(--ink)}
.asks li small{display:block;font:15px var(--form);color:var(--graphite)}

/* ── talk bar: a write-in line and the big button ── */
footer{display:flex;align-items:center;gap:26px;padding:0 40px;border-top:2px solid var(--ink);background:var(--paper)}
.talk{font:24px var(--print);padding:18px 30px;background:var(--ink);color:var(--paper);gap:14px;min-width:330px;justify-content:center}
.talk svg{width:28px;height:28px}
.write{flex:1;display:flex;align-items:flex-end;gap:14px;font:17px var(--form)}
.write .in{flex:1;border-bottom:1.5px solid var(--ink);font:22px var(--text);color:#6f6c62;padding:6px 4px}

/* ── identity sheet ── */
.idsheet{grid-column:1/-1;padding:30px 40px 24px;min-height:0}
.idsheet .card{height:100%;display:grid;grid-template-columns:1.05fr 1fr}
.swatch{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:center}
.swatch i{height:52px;border:1.5px solid var(--ink)}
.swatch span{font:18px/1.35 var(--text);color:var(--graphite)}
.swatch b{font:21px var(--print);color:var(--ink)}
.idsheet h1{font:80px/1 var(--head);text-transform:uppercase;letter-spacing:.04em;margin:0}
.idsheet .lede{font:29px/1.32 var(--print);margin:0;max-width:30em}
.idsheet p{margin:0;font:20px/1.45 var(--text);color:var(--graphite)}
.idsheet p b{color:var(--ink)}
.idsheet .pair{display:grid;grid-template-columns:1fr 1fr;gap:16px 30px}
.idsheet .pair label{font:17px var(--form);display:block;margin-bottom:4px}
.idsheet .pair div{font:19px/1.4 var(--text);color:var(--graphite)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Barnaby's bell as a printed mark: line only, as a jobbing printer would cut it -->
    <symbol id="bell" viewBox="0 0 48 48"><path d="M24 7.5v4.5M20.5 7.5h7M8.5 35a15.5 15.5 0 0 1 31 0M5 35h38v4.5H5zM14 30a10.5 10.5 0 0 1 6.5-8" /></symbol>
    <symbol id="mic" viewBox="0 0 24 24"><path d="M9 3h6v11H9zM5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5M8.5 21.5h7"/></symbol>
    <symbol id="tick" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></symbol>
    <symbol id="key" viewBox="0 0 24 24"><circle cx="7.5" cy="12" r="4"/><path d="M11.5 12h10M17.5 12v4M20.5 12v3"/></symbol>
    <symbol id="lit" viewBox="0 0 24 24"><path d="M4 4h16v16H4z" fill="currentColor"/></symbol>
    <symbol id="cross" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="dots" viewBox="0 0 24 24"><path d="M5 12h1M11.5 12h1M18 12h1" stroke-width="3"/></symbol>
    <symbol id="see" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M3 12h17M14 6l6 6-6 6"/></symbol>
    <symbol id="new" viewBox="0 0 24 24"><path d="M4 4h16v16H4z" stroke-dasharray="3 2.4"/><path d="M12 8v8M8 12h8"/></symbol>
    <symbol id="chev" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></symbol>
    <symbol id="short" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 17.5v1"/></symbol>
  </defs>
</svg>

<header>
  <div class="mark"><svg class="i"><use href="#bell"/></svg><b>Barnaby</b><span>looks after the system<br>at Spokes &amp; Sprockets</span></div>
  <div class="now" id="now" aria-live="polite"></div>
  <nav id="tabs" aria-label="Views"></nav>
  <div class="desk"><span>At the desk</span><button type="button" id="who" aria-haspopup="listbox"><span>Martin</span><svg class="i"><use href="#chev"/></svg></button></div>
  <div class="date">Mon 23 Nov</div>
</header>
<main id="main"></main>
<footer id="foot"></footer>

<script src="content.js"></script>
<script>
(() => {
  const S = window.STORY, M = new URLSearchParams(location.search).get('m') || '1';
  const ic = (id, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const $ = s => document.querySelector(s);
  const first = j => j.who.split(' ')[0];

  function now(state) {
    const t = { idle: ['', 'At your service'], look: ['live', S.m1.steps[1].doing],
      speak: ['', 'Answering'], wait: ['', 'Waiting for your say-so'] }[state];
    $('#now').innerHTML = `<small>Now</small>${t[0] ? '<span class="live"></span>' : ''}<span>${t[1]}</span>`;
  }
  function chrome(who, tabs, on) {
    $('#who span').textContent = who;
    $('#tabs').innerHTML = tabs.map(t => `<a href="#" class="${t === on ? 'on' : ''}" ${t === on ? 'aria-current="page"' : ''}>${t}</a>`).join('');
    $('#foot').innerHTML = `<button class="talk" type="button">${ic('mic')}Hold to talk</button>
      <span class="hint">or hold the space bar</span>
      <div class="write"><span>Or write it:</span><span class="in">Ask Barnaby…</span></div><button type="button">Ask</button>`;
  }
  const MARTIN = ['Today’s cards', 'The house'];
  const head = (no, time, by = 'Martin', when = 'Mon 23 Nov') => `<div class="row" style="grid-template-columns:200px 1fr 1fr 1fr">
      <div class="f"><label>Card no.</label><div class="no">${no}</div></div>
      <div class="f"><label>Asked by</label><div class="val">${by}</div></div>
      <div class="f"><label>When</label><div class="val">${when}, ${time}</div></div>
      <div class="f"><label>How</label><div class="val">${ic('mic')}Spoken</div></div></div>`;

  function workDone(progress) {   // progress: how many of the five jobs' parts are checked; 5 = all done
    const s = S.m1.steps, done = progress >= 5;
    const who = (j, i) => i < progress ? (j.ok ? `${first(j)} ${ic('tick', 'sm')}` : `<b>${first(j)}: short</b>`) : `<span class="pend">${first(j)}</span>`;
    return `<ul class="work">
      <li><span class="box">${ic('tick')}</span><span><b>${s[0].did}.</b> ${s[0].found}.</span></li>
      <li><span class="box ${done ? '' : 'doing'}">${done ? ic('tick') : ic('dots')}</span><span><b>${done ? s[1].did + '.' : s[1].doing + '…'}</b> ${done ? s[1].found + '.' : `${progress} of 5 so far.`}
        <span class="sub">${S.m1.due.map(who).join(' · ')}</span></span></li></ul>`;
  }
  function dueTable(progress) {
    return `<table><tr><th>No.</th><th>Customer and bike</th><th>Work</th><th>With</th><th>Parts</th></tr>
      ${S.m1.due.map((j, i) => `<tr class="${!j.ok && i < progress ? 'short' : ''}"><td class="n">${j.n}</td>
        <td><b>${j.who}</b><br>${j.bike}</td><td>${j.work}</td><td>${j.mech}</td>
        <td class="p">${i < progress ? (j.ok ? j.parts : `${ic('short', 'sm')} ${j.parts}`) : '<span class="pend">checking…</span>'}</td></tr>`).join('')}</table>`;
  }

  /* filed copies (pink), newest first */
  const FILED = [
    { no: '0416', when: `${S.arrival.when}, ${S.arrival.time}`, by: 'Theo', q: S.arrival.ask.split('. ')[0] + '.', out: S.arrival.filed },
    { no: '0417', when: `Mon 23 Nov, ${S.m1.time}`, q: S.m1.ask, out: 'Five due. Anika’s brakes short one pair of pads.' },
    { no: '0418', when: `Mon 23 Nov, ${S.m2.time}`, q: S.m2.ask, out: 'Key given: ordering. Ten pairs ordered from Madison, £65.' },
    { no: '0419', when: 'Mon 23 Nov, 14:02', q: 'Barnaby, Sofia’s bike’s done.', out: 'Sofia texted; her Defy marked ready.' },
    { no: '0420', when: 'Mon 23 Nov, 14:07', q: 'Kwame’s.', out: 'Kwame texted; his Boardman marked ready.' },
    { no: '0421', when: 'Mon 23 Nov, 14:12', q: 'And Jana’s.', out: 'Jana texted; her Grail marked ready.' },
    { no: '0422', when: `Mon 23 Nov, ${S.passage.time}`, q: 'Tom’s Brompton.', out: 'Handing back a bike is one step now. Tom texted; marked ready.' },
  ];
  function filed(upto, keys, extra = '') {
    const list = FILED.slice(0, upto).reverse();
    const shown = list.slice(0, 3), rest = list.length - shown.length;
    const k = keys.length ? `<ul>${keys.map(([n, t]) => `<li>${ic('key')}${n} <span class="hint">· ${t}</span></li>`).join('')}</ul>` : '<p class="none">None yet. Barnaby can only look.</p>';
    return `<h2>Filed today</h2>${shown.map(c => `<div class="stub"><div class="top"><span class="no">${c.no}</span><span>${c.when}${c.by ? ' · ' + c.by : ''}</span></div>
      <div class="q">“${c.q}”</div><div class="out">${ic('tick')}<span>${c.out}</span></div></div>`).join('')}
      ${rest ? `<div class="more">and ${rest === 1 ? 'one' : rest} earlier ${rest === 1 ? 'card' : 'cards'}</div>` : ''}${extra}
      <div class="keys"><h3>Keys you’ve given him</h3>${k}</div>`;
  }

  function signKey() {
    const c = S.m2.card;
    return `<div class="sign"><h3>${c.title}</h3>
      <dl class="lines">${c.lines.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
      <div class="act"><button class="primary" type="button">${ic('tick')}${c.yes}</button><button type="button">${c.no}</button>
        <div class="sigline">Allowed by <i></i></div></div>
      <div class="foot"><span>Once allowed, this copy is filed with your initials.</span><span class="tech">${c.technical}</span></div></div>`;
  }
  function signBuild(open) {
    const c = S.m3.card;
    return `<div class="sign"><h3>${c.title}</h3>
      <dl class="lines">${c.lines.map(([k, v], i) => `<dt>${k}</dt><dd>${i === 2 ? ic('tick') : ''}${v}</dd>`).join('')}</dl>
      <div class="act"><button class="primary" type="button">${ic('tick')}${c.yes}</button><button type="button">${c.no}</button>
        <button class="link ${open ? 'open' : ''}" type="button" aria-expanded="${open}">${c.see}</button><div class="sigline">Added by <i></i></div></div>
      <div class="foot"><span>${c.where} ${c.clickOnly}</span><span class="tech">${c.technical}</span></div></div>`;
  }

  function parseDiff() {
    const files = []; let cur = null;
    for (const line of S.real.diff.split('\n')) {
      if (line.startsWith('diff --git')) { cur = { name: line.replace(/^diff --git a\/(\S+).*$/, '$1'), lines: [], add: 0 }; files.push(cur); continue; }
      if (/^(index |--- |\+\+\+ |new file mode)/.test(line) || !cur) continue;
      if (line.startsWith('+')) cur.add++;
      cur.lines.push(line);
    }
    return files;
  }
  const diffLines = f => f.lines.map(l => `<div class="ln ${l.startsWith('@@') ? 'hunk' : l.startsWith('+') ? 'add' : ''}">${esc(l.startsWith('@@') ? '· · ·' : l.slice(1)) || ' '}</div>`).join('');
  function changeSheet() {
    const files = parseDiff(), total = files.reduce((a, f) => a + f.add, 0);
    const body = files.map(f => `<div class="fileh">${esc(f.name)}<span>${S.m3.card.files[f.name] || ''} · ${f.add} lines added</span></div>${diffLines(f)}`).join('');
    return `<div class="sheet"><div class="sh"><b>The change, for whoever wants to read it</b><span>${files.length} files · ${total} lines added · nothing removed · ${S.real.tested.split(',')[0]}</span></div><div class="body">${body}</div></div>`;
  }

  /* ── the house ── */
  function plan() {
    const R = Object.fromEntries(S.rooms.map(r => [r.id, r]));
    const li = it => {
      const [, label, state, flag] = it;
      const mark = state === 'lit' ? ic('lit') : state === 'key' ? ic('key') : ic('cross');
      const note = flag === 'given' ? '<em>your key</em>' : flag === 'new' ? '<em>new</em>' : state === 'shut' ? '<em>kept shut</em>' : '';
      return `<li class="${state}">${mark}<span><mark>${label}</mark>${note}</span></li>`;
    };
    const room = (id, x, y, w, h) => {
      const r = R[id], lit = r.items.some(i => i[2] === 'lit');
      return `<div class="room ${lit ? '' : 'dark'} ${r.isNew ? 'new' : ''}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
        <h4>${r.name}${r.isNew ? '' : `<small>${r.place}</small>`}</h4><ul>${r.items.map(li).join('')}</ul></div>`;
    };
    const p = S.passage;
    return `<div class="plan"><h2>The house: everything Theo’s system can do</h2>
      <p class="sub">Highlighted, he can use it. A key, he’d have to ask you first. Nothing changes without a card.</p>
      <div class="house">
        ${room('invoices', 0, 0, 300, 210)}${room('reports', 296, 0, 330, 210)}${room('mechanics', 622, 0, 300, 210)}${room('parts', 918, 0, 322, 240)}
        ${room('customers', 0, 206, 420, 340)}${room('jobs', 416, 206, 506, 340)}${room('orders', 918, 236, 322, 310)}
        <div class="passage" style="left:0;top:542px;width:922px;height:96px"><b>${p.name}</b>${ic('arrow')}<span>${p.steps.join(' → ')}</span><span class="when">made at ${p.time}</span></div>
        ${room('workload', 918, 542, 322, 132)}
        <div class="stamp" style="left:1096px;top:556px">Built today</div>
      </div></div>`;
  }
  function legend() {
    const c = S.counts;
    return `<h2>Key to the plan</h2><div class="legend">
      <div><span class="sw" style="background:var(--canary)"></span><span><b>Highlighted.</b> Barnaby can use it.</span></div>
      <div><span class="sw">${ic('key')}</span><span><b>Key.</b> He could ask you for it.</span></div>
      <div><span class="sw" style="border-style:dashed"></span><span><b>Dashed walls.</b> A room he built, with your say-so.</span></div>
      <div><span class="sw" style="background:repeating-linear-gradient(90deg,var(--canary) 0 8px,var(--canary-deep) 8px 10px)"></span><span><b>Passage.</b> Steps he joined into one.</span></div>
      <div><span class="sw">${ic('cross')}</span><span><b>Kept shut.</b> Never, whoever asks.</span></div></div>
      <div class="count"><span class="big">${c.can}</span> of ${c.of} things he can do, plus ${c.passages === 1 ? 'one passage' : c.passages + ' passages'}.<br>Everything else stays locked until you hand him the key.</div>
      <div class="keys"><h3>Keys you’ve given him</h3><ul>${S.keysGiven.map(([k, t]) => `<li>${ic('key')}${k} <span class="hint">· ${t}</span></li>`).join('')}</ul></div>`;
  }

  /* ── Theo: the office copy ── */
  function office() {
    const T = S.theo, R = S.real;
    const roomOf = Object.fromEntries(S.rooms.flatMap(r => r.items.map(i => [i[0], r.name])));
    const all = [...R.endpoints, ...R.built.map(k => ({ key: k, tool: 'workload', read_only: true, built: true }))];
    const exposed = new Set(T.exposed), denied = new Set(T.denied);
    const rows = all.map(e => {
      const [m, path] = e.key.split(' ');
      const st = denied.has(e.key) ? 'shut' : exposed.has(e.key) ? 'on' : 'off';
      const icon = st === 'shut' ? ic('cross') : st === 'on' ? (e.built ? ic('new') : ic('lit')) : ic('key');
      return `<tr class="${st}"><td class="st">${icon}</td><td class="m">${m}</td><td class="path">${esc(path)}</td><td>${e.tool}</td><td class="rw">${e.read_only ? 'reads' : 'writes'}</td><td class="rm">${roomOf[e.key]}${e.built ? ' · built' : ''}</td></tr>`;
    }).join('');
    const runs = T.synapse.map(r => `<li><span class="w">${r.when}</span><code>synapse ${esc(r.cmd)}</code><span class="s">${r.s.toFixed(2)} s</span><span class="o">${r.what}: ${esc(r.out)}</span></li>`).join('');
    const calls = T.trace.calls.map(c => `<li class="${c.short ? 'short' : ''}"><span>${c.tool}(${Object.values(JSON.parse(c.args)).map(v => JSON.stringify(v)).join(', ')})</span><span class="r">${esc(c.res)}</span></li>`).join('');
    const files = parseDiff();
    return `<section class="office">
      <div class="ob"><header><b>Found in Theo’s code</b><span>synapse build --auto --local · ${T.system.repo}</span></header>
        <div class="tally"><div><strong>${all.length}</strong>discovered</div><div><strong>${T.exposed.length}</strong>exposed as MCP tools</div><div><strong>${all.length - T.exposed.length - T.denied.length}</strong>unlockable</div><div><strong>${T.denied.length}</strong>on the deny-list</div></div>
        <table class="eps"><tr><th></th><th>Method</th><th>Path</th><th>Tool</th><th></th><th>Room</th></tr>${rows}</table></div>
      <div style="display:flex;flex-direction:column;gap:16px;min-height:0">
        <div class="ob"><header><b>Synapse runs</b><span>${T.system.name} · ${T.system.base}</span></header><ul class="runs">${runs}</ul></div>
        <div class="ob"><header><b>Last turn, call by call</b><span>shop · ${(T.trace.ms / 1000).toFixed(1)} s · ${T.trace.modelTurns} model turns</span></header>
          <ul class="calls">${calls}</ul></div>
        <div class="ob" style="flex:1"><header><b>History</b><span>git log, newest first</span></header>
          <ul class="log">${(S.real.gitlog || []).map(c => `<li class="${c.author === 'Barnaby' ? 'new' : ''}"><b>${c.date.slice(0, 4)}</b><span>${esc(c.subject)}${c.author === 'Barnaby' ? ' · Barnaby' : ''}</span></li>`).join('')}</ul></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px;min-height:0">
        <div class="ob"><header><b>Barnaby’s change</b><span>approved by Martin, 15:06, by click</span></header>
          <dl class="kv"><dt>Adds</dt><dd><code>${R.built[0]}</code></dd><dt>Files</dt><dd>${files.map(f => `<code>${f.name}</code>`).join(', ')}</dd>
          <dt>Size</dt><dd>${T.build.added} lines added, ${T.build.removed} removed</dd><dt>Tests</dt><dd><code>pytest -q</code>: ${R.tested}</dd>
          <dt>How</dt><dd>${T.build.worktree}; ${T.build.endToEnd} end to end</dd></dl></div>
        <div class="ob"><header><b>Composed skill</b><span>server ${T.skill.server}</span></header>
          <dl class="kv"><dt>Tool</dt><dd><code>${T.skill.tool}</code></dd><dt>From</dt><dd><code>${T.skill.from.join(' + ')}</code></dd><dt>Does</dt><dd>${T.skill.description}</dd></dl></div>
        <div class="ob" style="flex:1"><header><b>The diff</b><span>${files.length} files · +${T.build.added} −${T.build.removed}</span></header>
          <div class="diff">${files.map(f => `<div class="fileh">${esc(f.name)}<span>+${f.add}</span></div>${diffLines(f)}`).join('')}</div></div>
      </div></section>`;
  }

  /* ── Priya: her bench, as the tags on the bikes (proposal) ── */
  function tagShape() {
    return `<svg class="shape" viewBox="0 0 500 612" preserveAspectRatio="none" aria-hidden="true">
      <path d="M60 1.5H440L498.5 60V610.5H1.5V60Z" fill="var(--manila)" stroke="var(--ink)" stroke-width="2"/>
      <circle cx="250" cy="44" r="19" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/><circle cx="250" cy="44" r="10" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/>
      <path d="M250 25C248 0 245 -30 246 -50" stroke="var(--ink)" stroke-width="2" fill="none"/><path d="M246 -50c-11 1 -13 -16 0 -16s11 15 0 16" stroke="var(--ink)" stroke-width="2" fill="none"/></svg>`;
  }
  function tag(t) {
    const parts = t.parts.map(([n, s, ok]) => `<li class="${ok ? '' : 'no-stock'}">${ok ? ic('tick') : ic('short')}<span>${n}<small>${s}</small></span></li>`).join('');
    const short = t.parts.find(p => !p[2]);
    return `<div class="tag">${tagShape()}
      <div class="hd"><span>Spokes &amp; Sprockets<br>Repair tag</span><span class="no">${t.n}</span></div>
      <dl><dt>Bike</dt><dd><b>${t.bike}</b><small>${t.colour}</small></dd>
        <dt>Customer</dt><dd>${t.who}</dd>
        <dt>Work</dt><dd>${t.work}<small>${t.hours} · was Dev’s, yours from 15:08</small></dd>
        <dt>Due</dt><dd><b>${t.dueWord}</b>, ${t.due}</dd></dl>
      <div class="parts"><label>Parts</label><ul>${parts}</ul></div>
      <div class="state ${t.ready ? '' : 'short'}">${t.ready ? ic('tick') + 'Parts ready' : ic('short') + 'Spokes short: ask Martin'}</div></div>`;
  }
  function bench() {
    const P = S.priya;
    return `<section class="bench">
      <div class="rail"><h2>Priya’s bench<small>your jobs, as the tags on the bikes</small></h2><div class="bar"></div>
        <div class="proposal">Proposal</div>
        <div class="tags">${P.tags.map(tag).join('')}</div></div>
      <aside class="chat">
        <div class="card"><div class="row" style="grid-template-columns:150px 1fr 1fr">
          <div class="f"><label>Card no.</label><div class="no">0425</div></div><div class="f"><label>Asked by</label><div class="val">Priya</div></div>
          <div class="f"><label>When</label><div class="val">Mon, ${P.time}</div></div></div>
          <div class="row"><div class="f"><label>Asked</label><div class="asked">“${P.ask}”</div></div></div>
          <div class="row"><div class="f"><label>Barnaby’s answer</label><div class="says" style="font-size:29px">${P.say} ${P.aside}</div></div></div></div>
        <div class="note"><small>From Theo’s notes for whoever looks after it next</small>${P.note.text}<br>— T.</div>
      </aside>
      <div class="asks"><b>Things you can ask me</b><ul>${P.asks.map(([q, c]) => `<li>“${q}”<small>${c}</small></li>`).join('')}</ul></div>
    </section>`;
  }

  /* ── identity sheet ── */
  function sheet() {
    const sw = (c, n, h) => `<div class="swatch"><i style="background:${c}"></i><span><b>${n}</b><br>${h}</span></div>`;
    return `<section class="idsheet"><div class="card">
      <div class="f" style="padding:32px 36px;display:flex;flex-direction:column;gap:22px">
        <div style="display:flex;gap:24px;align-items:center"><svg class="i" style="width:116px;height:116px;color:var(--brass);stroke-width:1.4"><use href="#bell"/></svg>
          <h1>Job Card</h1><span class="hint" style="margin-left:auto;align-self:flex-start">Direction A of three</span></div>
        <p class="lede">Every request gets a numbered card. Every key and every change is signed off on the yellow copy, and the copies are filed where Martin can see them.</p>
        <p><b>Why he’d trust it: procedure.</b> Martin has run the shop on job cards since 1987. If it’s on a card and signed, it was done properly, and nothing happens off the card. Consent feels like signing a job card, not clicking a dialog box.</p>
        <p><b>The same form, three copies.</b> Martin reads the top copy, in plain words. Theo gets the pink office copy: everything, technical and exact. Priya gets the tear-off tags that hang on the bikes.</p>
        <p><b>Signature: the perforation.</b> Whatever needs Martin’s say-so arrives as the canary copy, torn along a dashed line from the card above, with a line to sign. Everything Barnaby can use is marked with the same yellow highlighter, on the cards and on the plan of the house.</p>
        <div class="pair" style="margin-top:auto">
          <div><label>Motion</label>Stamped and filed. A card tears off along the perforation and drops into the file; ticks are drawn on; the sign-off lands like a rubber stamp. Nothing loops.</div>
          <div><label>Sound</label>A pencil tick for each step, the thunk of a date stamp when you sign, and one ring of the counter bell when he answers.</div></div>
      </div>
      <div class="f" style="padding:32px 36px;display:grid;gap:14px;align-content:start;border-right:0">
        <label style="font:17px var(--form)">Paper and ink</label>
        ${sw('var(--paper)', 'Top copy', 'The card in hand. #FBFBF8')}
        ${sw('var(--canary)', 'Canary copy', 'Sign here; he can use it; added. #F5EAA6')}
        ${sw('var(--pink)', 'Office copy', 'Filed cards, and Theo’s full record. #F4DDD7')}
        ${sw('var(--manila)', 'Tag stock', 'The tags on the bikes. #E9D6A8')}
        ${sw('var(--ink)', 'Printer’s black', 'Rules, labels, Barnaby’s words. #1C1C1A')}
        ${sw('var(--number)', 'Numbering red', 'Card numbers and stamps only. #B3271B')}
        ${sw('var(--brass)', 'Brass ink', 'The bell mark, nothing else. #8E6820')}
        <label style="font:17px var(--form);margin-top:6px">Type, all already on the shop PC</label>
        <div style="font:40px/1 var(--form);text-transform:uppercase">Franklin Gothic Cond: the printed form</div>
        <div style="font:28px/1.2 var(--print)">Franklin Gothic Medium for Barnaby’s words</div>
        <div style="font:22px/1.3 var(--text);color:var(--graphite)">Segoe UI for what’s written in · <span style="font-family:var(--code)">Consolas</span> on the office copy</div>
        <div style="display:flex;gap:26px;margin-top:6px">${['bell', 'mic', 'tick', 'key', 'lit', 'new', 'cross', 'short', 'see'].map(i => `<svg class="i" style="width:40px;height:40px;${i === 'bell' ? 'color:var(--brass)' : ''}"><use href="#${i}"/></svg>`).join('')}</div>
      </div></div></section>`;
  }

  /* ── moments ── */
  const main = $('#main');
  if (M === '1a' || M === '1') {
    const done = M === '1', prog = done ? 5 : S.m1.checkedSoFar;
    chrome('Martin', MARTIN, MARTIN[0]); now(done ? 'speak' : 'look');
    const working = `<div class="says wait">${S.m1.steps[0].doing}… <b>${S.m1.steps[1].doing.toLowerCase()}</b><span class="caret"></span></div>`;
    main.innerHTML = `<section class="deskarea"><div class="card">${head('0417', S.m1.time)}
      <div class="row"><div class="f"><label>Asked</label><div class="asked">“${S.m1.ask}”</div></div></div>
      <div class="row"><div class="f"><label>Barnaby’s answer</label>${done ? `<div class="says">${S.m1.say}</div>` : working}</div></div>
      <div class="row" style="grid-template-columns:470px 1fr"><div class="f"><label>Work done</label>${workDone(prog)}</div>
        <div class="f"><label>Due tomorrow, Tuesday 24 November</label>${dueTable(prog)}</div></div>
      </div></section><aside class="filed">${filed(1, [])}</aside>`;
  } else if (M === '2') {
    chrome('Martin', MARTIN, MARTIN[0]); now('wait');
    main.innerHTML = `<section class="deskarea"><div class="card">${head('0418', S.m2.time)}
      <div class="row"><div class="f"><label>Asked</label><div class="asked">“${S.m2.ask}”</div></div></div>
      <div class="row"><div class="f"><label>Barnaby’s answer</label><div class="says">${S.m2.say}</div></div></div></div>
      ${signKey()}</section><aside class="filed">${filed(2, [])}</aside>`;
  } else if (M === '3' || M === '3b') {
    chrome('Martin', MARTIN, MARTIN[0]); now('wait');
    main.innerHTML = `<section class="deskarea"><div class="card">${head('0423', S.m3.time)}
      <div class="row"><div class="f"><label>Asked</label><div class="asked">“${S.m3.ask}”</div></div></div>
      <div class="row"><div class="f"><label>Barnaby’s answer</label><div class="says">${S.m3.say}</div></div></div></div>
      ${signBuild(M === '3b')}</section><aside class="filed">${M === '3b' ? changeSheet() : filed(7, S.keysGiven.slice(0, 1))}</aside>`;
  } else if (M === '4') {
    chrome('Martin', MARTIN, MARTIN[1]); now('idle');
    main.innerHTML = `<section class="deskarea">${plan()}</section><aside class="filed" style="background:var(--paper)">${legend()}</aside>`;
  } else if (M === '5') {
    chrome('Theo', ['Office copy', 'The house'], 'Office copy'); now('idle');
    main.innerHTML = office();
  } else if (M === '6') {
    chrome('Priya', ['My bench', 'The house'], 'My bench'); now('idle');
    main.innerHTML = bench();
  } else if (M === '0') {
    chrome('Martin', MARTIN, MARTIN[0]); now('idle');
    main.innerHTML = sheet();
  }
})();
</script>
</body>
</html>
