<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><title>Theo · the workshop hologram, fully himself · Lisbon (scene 8, staged)</title>
<style>html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #EDE6DA; } svg { display: block; }</style></head>
<body>
<div id="stage"></div>
<script src="../data/building.js"></script>
<script src="../data/story.js"></script>
<script src="lib/theo-shared.js"></script>
<script src="lib/theo-hologram.js"></script>
<script>
(function () {
  /* Script v2.1 scene 8 (staged): the Lisbon studio, Mon 23 Nov 2026, Theo's first day. A stand-in desk: the
     lisbon-pc look-dev had no desk yet. Main monitor tiled (terminal, the real app in a browser tile, Barnaby's form);
     second monitor ComfyUI's graph and queue with Barnaby beside it. Counts are the real scans (13 and 28); the
     houses show structure only: no room names exist for these systems, so none are drawn. */
  const T = THEO, H = HOLO, C = H.C, L = WORLDS.story.lisbon, W = 1920, Ht = 1080;
  const svg = T.svgRoot(document.getElementById('stage'), W, Ht), el = T.el;
  const defs = el('defs', {}, svg);
  const sun = el('linearGradient', { id: 'sunwall', x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
  el('stop', { offset: 0, 'stop-color': '#F4EDE1' }, sun); el('stop', { offset: 1, 'stop-color': '#E2D8C9' }, sun);
  const cl = el('clipPath', { id: 'mainScr' }, defs); el('rect', { x: 84, y: 186, width: 1092, height: 614 }, cl);
  const cl2 = el('clipPath', { id: 'secScr' }, defs); el('rect', { x: 1258, y: 236, width: 598, height: 336 }, cl2);

  // the room: plaster wall, the window over terracotta roofs, the sun's patch
  el('rect', { x: 0, y: 0, width: W, height: Ht, fill: 'url(#sunwall)' }, svg);
  el('rect', { x: 0, y: 0, width: W, height: 150, fill: '#F6E9D3' }, svg);
  const roofs = el('g', {}, svg), rr = H.rng(5), facades = ['#F1E6D2', '#E8CFA8', '#DDBFA6', '#F3EDE2', '#E6D6B8'];
  for (let x = -30, i = 0; x < W; i++) {
    const w = 110 + rr() * 150, top = 70 + rr() * 40, roofH = 16 + rr() * 12, col = ['#B9633D', '#C97A4C', '#A9573A', '#C26A42'][i % 4];
    el('rect', { x, y: top, width: w, height: 150 - top, fill: facades[i % 5] }, roofs);
    el('polygon', { points: `${x - 4},${top} ${x + w + 4},${top} ${x + w - 10},${top - roofH} ${x + 10},${top - roofH}`, fill: col }, roofs);
    for (let wx = x + 14; wx < x + w - 18; wx += 26) for (let wy = top + 12; wy < 140; wy += 24) el('rect', { x: wx, y: wy, width: 9, height: 13, fill: '#8C6A52', opacity: .55 }, roofs);
    if (rr() > .55) el('rect', { x: x + w * .7, y: top - roofH - 12, width: 9, height: 14, fill: col }, roofs);
    x += w + 2;
  }
  el('rect', { x: 0, y: 146, width: W, height: 14, fill: '#D9CFC0' }, svg);           // window sill
  el('rect', { x: 0, y: 0, width: W, height: 8, fill: '#D9CFC0' }, svg);
  [480, 960, 1440].forEach(x => el('rect', { x: x - 6, y: 0, width: 12, height: 150, fill: '#D9CFC0' }, svg));
  el('polygon', { points: '980,160 1560,160 1700,700 1120,700', fill: '#FFF6E6', opacity: .55 }, svg);   // sun on the wall

  // the desk
  el('rect', { x: 0, y: 872, width: W, height: 208, fill: '#C9A57D' }, svg);
  el('rect', { x: 0, y: 872, width: W, height: 6, fill: '#B48F67' }, svg);

  // monitor arms, then the monitors
  el('rect', { x: 620, y: 812, width: 22, height: 64, fill: '#2A2B2F' }, svg);
  el('rect', { x: 1546, y: 586, width: 18, height: 290, fill: '#2A2B2F' }, svg);
  el('rect', { x: 70, y: 172, width: 1120, height: 642, rx: 10, fill: '#141518' }, svg);
  el('rect', { x: 1244, y: 222, width: 626, height: 364, rx: 9, fill: '#141518' }, svg);

  /* ---------- main monitor: tiling ---------- */
  const m = el('g', { 'clip-path': 'url(#mainScr)' }, svg);
  el('rect', { x: 84, y: 186, width: 1092, height: 614, fill: '#0A0B0E' }, m);
  const mb = el('g', { transform: 'translate(84,186)' }, m);
  T.wmBar(mb, 1092, { title: 'barnaby · quorum', ws: 1, when: L.when.replace(' 2026', ''), accent: C.amber });
  // tile 1: terminal (top left)
  const t1 = el('g', { transform: 'translate(90,218)' }, m);
  el('rect', { x: 0, y: 0, width: 420, height: 270, fill: '#101114', stroke: '#2A2C31' }, t1);
  T.code(t1, 14, 26, ['$ synapse build --auto --local'], { fs: 13, fill: '#E8E4DA' });
  T.code(t1, 14, 48, ['synapse build · quorum · 13 endpoint(s)'], { fs: 13, fill: C.amber });
  T.code(t1, 14, 82, ['$ synapse build --auto --local'], { fs: 13, fill: '#E8E4DA' });
  T.code(t1, 14, 104, ['synapse build · comfyui · 28 endpoint(s)'], { fs: 13, fill: C.amber });
  T.code(t1, 14, 138, ['$ █'], { fs: 13, fill: '#E8E4DA' });
  // tile 2: the real app, as it ships (a capture), in a browser tile
  const t2 = el('g', { transform: 'translate(90,494)' }, m);
  el('rect', { x: 0, y: 0, width: 420, height: 300, fill: '#16171B', stroke: '#2A2C31' }, t2);
  el('rect', { x: 0, y: 0, width: 420, height: 24, fill: '#1E2024' }, t2);
  T.text(t2, 12, 16, 'Barnaby · the real app', { fill: '#BFBBB2', 'font-family': 'Segoe UI', 'font-size': 12 });
  const ic = el('clipPath', { id: 'appclip' }, defs); el('rect', { x: 90, y: 518, width: 420, height: 276 }, ic);
  el('image', { href: '../../lisbon-pc/realapp/probe-1440.png', x: 90, y: 518, width: 604.8, height: 420, 'clip-path': 'url(#appclip)', preserveAspectRatio: 'xMinYMin slice' }, m);
  // tile 3: Barnaby, fully himself: the crew's memory read as a house of light
  const t3 = el('g', {}, m);
  el('rect', { x: 516, y: 218, width: 654, height: 576, fill: '#06080B', stroke: '#2A2C31' }, t3);
  house(t3, { cx: 812, cy: 394, s: 32, n: 13, w: 9, d: 6, scan: 6.5, label: 'quorum', count: '13 endpoint(s)' });
  const say = el('g', {}, t3), lines = [
    ['THEO', ['Barnaby, new job. This is the crew’s memory.'], false],
    ['BARNABY', ['Thirteen endpoints, sir, and two deadlines in dispute.', 'Shall I flag them?'], true],
    ['THEO', ['Still Theo.'], false], ['BARNABY', ['Theo.'], true],
    ['THEO', ['And the render box?'], false],
    ['BARNABY', ['Twenty-eight endpoints. It’s on the big card,', 'and three jobs are queued.'], true],
    ['THEO', ['Show-off.'], false]];
  let y = 520;
  lines.forEach(([who, ls, b]) => {
    T.text(say, 540, y, who, { fill: b ? C.white : C.amber, 'font-family': 'Bahnschrift', 'font-size': 11.5, 'font-weight': 600, 'letter-spacing': '0.14em' });
    ls.forEach((s1, k) => T.text(say, 626, y + k * 22, s1, { fill: b ? C.white : C.amberLine, 'font-family': 'Bahnschrift', 'font-size': b ? 18 : 15.5, 'font-weight': 300 }));
    y += ls.length * 22 + (b ? 12 : 8);
  });

  /* ---------- second monitor: ComfyUI's graph and queue, Barnaby beside it ---------- */
  const s2 = el('g', { 'clip-path': 'url(#secScr)' }, svg);
  el('rect', { x: 1258, y: 236, width: 598, height: 336, fill: '#202124' }, s2);
  const grid = el('g', { stroke: '#2B2C30', 'stroke-width': 1 }, s2);
  for (let x = 1258; x < 1856; x += 20) el('line', { x1: x, y1: 236, x2: x, y2: 572 }, grid);
  for (let yy = 236; yy < 572; yy += 20) el('line', { x1: 1258, y1: yy, x2: 1856, y2: yy }, grid);
  const nodes = [['Load Checkpoint', 1272, 262, 120, 64], ['CLIP Text Encode', 1272, 344, 120, 54], ['Empty Latent Image', 1272, 414, 120, 46], ['KSampler', 1420, 300, 112, 108], ['VAE Decode', 1550, 300, 96, 46], ['Save Image', 1550, 364, 96, 64]];
  const wires = [[1392, 280, 1420, 320], [1392, 370, 1420, 346], [1392, 436, 1420, 372], [1532, 340, 1550, 318], [1646, 318, 1646, 330], [1598, 346, 1598, 364]];
  wires.forEach(([a, b, c, d]) => el('path', { d: `M${a},${b} C${a + 16},${b} ${c - 16},${d} ${c},${d}`, fill: 'none', stroke: '#8FA3B8', 'stroke-width': 2 }, s2));
  nodes.forEach(([n, x, yy, w, h]) => { el('rect', { x, y: yy, width: w, height: h, rx: 6, fill: '#353639', stroke: '#4A4B50' }, s2);
    el('rect', { x, y: yy, width: w, height: 18, rx: 6, fill: '#2C2D30' }, s2); T.text(s2, x + 7, yy + 13, n, { fill: '#D8D8D8', 'font-family': 'Segoe UI', 'font-size': 10 });
    for (let wy = yy + 24; wy < yy + h - 8; wy += 14) { el('rect', { x: x + 7, y: wy, width: w - 14, height: 9, rx: 4.5, fill: '#27282B' }, s2);
      el('circle', { cx: x, cy: wy + 4.5, r: 3, fill: ['#E0A14F', '#8FA3B8', '#B68FD0'][(wy / 14 | 0) % 3] }, s2); } });
  el('rect', { x: 1662, y: 250, width: 182, height: 140, rx: 6, fill: '#2A2B2E', stroke: '#45464B' }, s2);
  T.text(s2, 1674, 270, 'Queue', { fill: '#E3E3E3', 'font-family': 'Segoe UI', 'font-size': 12, 'font-weight': 600 });
  T.text(s2, 1832, 270, '3', { fill: '#E3E3E3', 'font-family': 'Segoe UI', 'font-size': 12, 'font-weight': 600, 'text-anchor': 'end' });
  [0, 1, 2].forEach(i => { el('rect', { x: 1674, y: 282 + i * 32, width: 158, height: 26, rx: 4, fill: '#36373B' }, s2);
    T.text(s2, 1682, 299 + i * 32, 'queued', { fill: '#B9B9B9', 'font-family': 'Segoe UI', 'font-size': 11 }); });
  // Barnaby, companion on this screen: the render box as a house of light, read
  el('rect', { x: 1662, y: 404, width: 188, height: 160, fill: '#06080B', stroke: '#2A2C31' }, s2);
  house(s2, { cx: 1758, cy: 480, s: 8.6, n: 28, w: 14, d: 7, scan: 13.5, small: true });
  T.text(s2, 1674, 424, '28 endpoint(s)', { fill: C.amber, 'font-family': 'Cascadia Code', 'font-size': 11 });
  T.text(s2, 1674, 552, 'big card · 3 queued', { fill: C.white, 'font-family': 'Cascadia Code', 'font-size': 11 });
  // keyboard and tablet on the desk
  el('rect', { x: 420, y: 924, width: 520, height: 120, rx: 10, fill: '#2C2D31' }, svg);
  for (let r = 0; r < 5; r++) for (let k = 0; k < 15; k++) el('rect', { x: 432 + k * 33.5, y: 934 + r * 21.5, width: 29, height: 18, rx: 3, fill: '#3E4046' }, svg);
  el('rect', { x: 990, y: 930, width: 300, height: 120, rx: 12, fill: '#1E1F23' }, svg);
  el('rect', { x: 1010, y: 946, width: 220, height: 88, rx: 4, fill: '#26272C' }, svg);
  // the 2009 photo, now on this desk, and a pastel de nata on its napkin
  el('rect', { x: 1356, y: 778, width: 108, height: 90, fill: '#F2EEE6', stroke: '#9C8F7C' }, svg);
  el('rect', { x: 1364, y: 786, width: 92, height: 66, fill: '#9FB2B8' }, svg);            // 2009 sky
  el('rect', { x: 1364, y: 800, width: 92, height: 52, fill: '#6E5E52' }, svg);            // the shop front
  el('rect', { x: 1364, y: 800, width: 92, height: 9, fill: '#2F4A3C' }, svg);             // its sign band
  el('rect', { x: 1372, y: 813, width: 26, height: 39, fill: '#3A3530' }, svg);            // the door
  el('rect', { x: 1404, y: 813, width: 44, height: 22, fill: '#8FA0A6' }, svg);            // the window
  [[1412, 6.5, '#2C2B2E'], [1434, 5.5, '#4C3B33']].forEach(([cx, r, c]) => {              // Martin, and teenage Theo
    el('circle', { cx, cy: 826, r: r * .7, fill: '#D9B79A' }, svg);
    el('rect', { x: cx - r, y: 831, width: r * 2, height: 21, rx: 2, fill: c }, svg);
  });
  el('circle', { cx: 1442, cy: 840, r: 3.2, fill: '#E8E8EC', stroke: '#9A9AA2', 'stroke-width': .6 }, svg);   // the CD-R
  el('rect', { x: 1364, y: 852, width: 92, height: 8, fill: '#F2EEE6' }, svg);
  el('polygon', { points: '1600,960 1720,948 1740,1010 1612,1024', fill: '#FBF8F2', stroke: '#E4DCCF' }, svg);
  el('ellipse', { cx: 1668, cy: 982, rx: 40, ry: 17, fill: '#D59B45' }, svg);
  el('ellipse', { cx: 1668, cy: 978, rx: 30, ry: 11, fill: '#F0C060' }, svg);
  el('ellipse', { cx: 1660, cy: 975, rx: 9, ry: 4, fill: '#7A4A1C', opacity: .8 }, svg);

  // disclosure, small
  T.text(svg, 36, 1060, 'Quorum and ComfyUI scenes staged · endpoint counts from real Synapse scans · the browser tile is a capture of the real app', { fill: '#5C4A36', 'font-family': 'Bahnschrift', 'font-size': 14 });

  /* a house of light with n bricks and no invented rooms: one volume, bricks on a grid, the scan plane passing */
  function house(g, o) {
    const P = T.projection({ cx: o.cx, cy: o.cy, s: o.s, yaw: -0.42, pitch: 0.62, ox: o.w / 2, oy: o.d / 2 });
    const Hh = o.small ? 1.6 : 2.2, cols = Math.ceil(Math.sqrt(o.n * o.w / o.d)), rows = Math.ceil(o.n / cols);
    const box = [[0, 0], [o.w, 0], [o.w, o.d], [0, o.d]];
    el('polygon', { points: P.pts(box.map(p => [p[0], p[1], 0])), fill: C.amberFaint, stroke: C.amberLine, 'stroke-width': 1.2 }, g);
    el('polygon', { points: P.pts(box.map(p => [p[0], p[1], Hh])), fill: 'none', stroke: C.amberDim, 'stroke-width': 1 }, g);
    box.forEach(p => { const a = P(p[0], p[1], 0), b = P(p[0], p[1], Hh); el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: C.amberDim, 'stroke-width': 1 }, g); });
    const items = [];
    for (let i = 0; i < o.n; i++) items.push([(i % cols + .5) * o.w / cols, (Math.floor(i / cols) + .5) * o.d / rows]);
    items.sort((a, b) => P.depth(a[0], a[1]) - P.depth(b[0], b[1])).forEach(([x, yy]) => {
      const sz = Math.min(o.w / cols, o.d / rows) * .5;
      const cube = [[x - sz / 2, yy - sz / 2], [x + sz / 2, yy - sz / 2], [x + sz / 2, yy + sz / 2], [x - sz / 2, yy + sz / 2]];
      el('polygon', { points: P.pts(cube.map(p => [p[0], p[1], .4])), fill: 'none', stroke: C.amberLine, 'stroke-width': .9 }, g);
      el('polygon', { points: P.pts(cube.map(p => [p[0], p[1], .4 + sz])), fill: 'none', stroke: C.amberLine, 'stroke-width': .9 }, g);
      cube.forEach(p => { const a = P(p[0], p[1], .4), b = P(p[0], p[1], .4 + sz); el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: C.amberLine, 'stroke-width': .9 }, g); });
    });
    const xs = o.scan;
    el('polygon', { points: P.pts([[xs, -.4, -.1], [xs, o.d + .4, -.1], [xs, o.d + .4, Hh + .8], [xs, -.4, Hh + .8]]), fill: C.accent, 'fill-opacity': .08, stroke: C.accent, 'stroke-width': 1, 'stroke-opacity': .6 }, g);
    const a = P(xs, 0, 0), b = P(xs, o.d, 0); el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: C.accent, 'stroke-width': 2 }, g);
    if (o.label) {
      const lp = P(o.w, 0, Hh);
      T.text(g, lp[0] + 18, lp[1] - 4, o.label, { fill: C.white, 'font-family': 'Cascadia Code', 'font-size': 15, 'font-weight': 600 });
      T.text(g, lp[0] + 18, lp[1] + 16, o.count, { fill: C.amber, 'font-family': 'Cascadia Code', 'font-size': 13 });
    }
  }

  const img = svg.querySelector('image');
  const done = () => document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
  if (img) { const probe = new Image(); probe.onload = done; probe.onerror = done; probe.src = img.getAttribute('href'); } else done();
})();
</script>
</body></html>
