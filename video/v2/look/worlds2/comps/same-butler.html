<script>
/* One event, Mon 23 Nov 16:16: Martin clicks "Add it" and the workload report lands. Theo (at his Lisbon desk, his
   first day) sees the new endpoint and the checks; Martin sees a new room in his building; Priya (who starts
   tomorrow) sees the two wheel builds Barnaby is about to offer her (Martin says yes at 16:21) and one new thing she
   can ask. Same build, same result, three worlds. */
(function () {
  const S = WORLDS.story, M = MARTIN, P = PRIYA, { bell, esc } = W2;
  const dot = (id, size, fill) => { const s = W2.svg(document.getElementById(id), size, size); bell(s, size / 2, size / 2 + .5, size * .62, fill); };
  // Martin
  dot('mbell', 36, '#fff'); document.getElementById('mbell').style.cssText = 'background:#1D1B17;border-radius:50%;box-shadow:0 0 0 3px #fff;flex:none';
  dot('msay', 36, M.GOLD_LT);
  document.getElementById('mline').textContent = 'Dev’s carrying thirty-one hours against his twenty.';
  const max = 31, pct = h => (h / max * 100).toFixed(2) + '%';
  document.getElementById('mres').innerHTML = '<h3>Booked this week</h3>' + S.build.result.map(([n, b, c]) => {
    const over = Math.max(0, b - c);
    return `<div class="r"><b>${n}</b><span>${String(b).replace(".5", "½")} of ${c}${over ? ` · <span class="over">${over} over</span>` : ''}</span>
      <div class="bar"><i style="width:${pct(Math.min(b, c))}"></i>${over ? `<i class="over" style="left:${pct(c)};width:${pct(over)}"></i>` : ''}<u style="left:calc(${pct(c)} - 1px)"></u></div></div>`;
  }).join('');
  // Priya
  dot('pbell', 34, '#E2B54E');
  document.getElementById('ptags').innerHTML =
      P.tag(S.priyaTuesday.bench[0], { ghost: true, style: 'left:44px;top:234px;transform:scale(.68) rotate(-1deg)' })
    + P.tag(S.priyaTuesday.bench[1], { ghost: true, style: 'left:150px;top:526px;transform:scale(.68) rotate(.8deg)' });
  document.getElementById('proll').innerHTML = P.asks([['Who’s got too much on this week?', 'reports', 'spanner']]);
  const pk = document.querySelector('#proll .pocket'); pk.querySelector('.pk').insertAdjacentHTML('beforeend', '<span class="new">new today</span>');

  document.fonts.ready.then(() => {
    // Theo
    const tc = document.getElementById('theo'), ts = W2.svg(tc, 640, 1080);
    THEO_SCENES.buildTall(ts, 640, 1080);
    // Martin's plan, portrait: back lane at the top, Market Place at the bottom
    M.plan(document.getElementById('mplan'), {
      moment: 'build', x: 44, y: 210, s: 34, rotate: true, focus: 'reports', built: true, labelSize: 21, labelSizes: { reports: 18.5 }, pipR: 4.6, wallW: 4, gutter: 7,
      labelAt: { stockroom: [19.55, 0.22], goodsin: [19.55, 5.3], workshop: [14.4, 3.95], reports: [11.62, 0.2], office: [9.2, 0.2], shop: [3.75, 0.3] },
      labelLines: { office: ['Back', 'office'], goodsin: ['Back', 'door'] },
      pipsPerRow: { shop: 9 }, streetSize: 15, skipFixtures: ['counter'],
      passage: true, passagePath: [[10.55, 6.22], [6.95, 6.02], [5.55, 5.0]], passageW: 12, passageDim: true,
      newSticker: [11.75, 4.75, 8, 74, 32], marker: [10.45, 2.05], markerR: 18,
    });
    // a leader from the new room to its result
    const T = (x, y) => [44 + y * 34, 210 + (20 - x) * 34], a = T(11.1, 3.0);
    W2.el('path', { d: `M${a[0]},${a[1]} L382,${a[1]} L382,462`, fill: 'none', stroke: '#7A1A41', 'stroke-width': 2.5 }, document.getElementById('mplan'));
    document.body.dataset.ready = '1';
  });
})();
</script>
